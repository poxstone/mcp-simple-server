services:
  mcp-simple-server:
    build: .
    ports:
      - "8080:8080"
    environment:
      MCP_TRANSPORT: sse
      FASTMCP_HOST: 0.0.0.0
      FASTMCP_PORT: "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/sse')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
